<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>

  <link rel="stylesheet"
    href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>

<body>

<div class="container d-flex justify-content-center my-5">
  
  <div class="col-md-6 col-lg-5 bg-light p-4 rounded shadow">

    <h3 class="text-center mb-4">Sign Up</h3>

    <!-- FORM START -->
    <form class="row g-3" action="signin.html">

      <div class="col-md-6">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" name="firstname" >
      </div>

      <div class="col-md-6">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" name="lastname" >
      </div>

      <div class="col-12">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" >
      </div>

      <div class="col-12">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" >
      </div>

      <div class="col-12">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" name="address">
      </div>

      <div class="col-12">
        <label class="form-label">City</label>
        <input type="text" class="form-control" name="city">
      </div>

      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="gridCheck">
          <label class="form-check-label" for="gridCheck">
            Agree to terms
          </label>
        </div>
      </div>

      <div class="col-12 d-grid">
        <button type="submit" class="btn btn-primary">
          Sign Up
        </button>
      </div>

    </form>
    <!-- FORM END -->

    <p class="text-center mt-3 mb-0">
      Already have an account?
      <a href="signin.html" class="text-decoration-none">Sign In</a>
    </p>

  </div>

</div>

<script src="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>

</body>
</html>
