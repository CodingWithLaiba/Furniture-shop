<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <title>Login Form</title>
    <style>
        body{
            height: 500px;
        }
       
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center bg-dark" >
    <form class="w-25  bg-light border-0 rounded-2 py-5 px-4">
        <p class="text-center fw-bold fs-3">Login</p>
  <div class="mb-3">
    <input type="email" class="form-control" id="Email" placeholder="Email">
  </div>
  <div class="mb-3">
    <input type="password" class="form-control w-full" id="Password" placeholder="password">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="checkbox">
    <label class="form-check-label" for="checkbox">Show password</label>
  </div>
  <div class="d-flex flex-column justify-content-center align-items-center">
  <button type="submit" class="btn btn-primary mb-3 px-4 py-2">Sign In</button>
  <p class="mb-0">Forget Password?</p>
  <p>Don't have an account?<span class="text-primary">Sign Up</span></p>
  </div>
</form>



    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
